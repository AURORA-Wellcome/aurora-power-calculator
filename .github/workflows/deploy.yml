name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by ref so a pull request build cannot cancel an in-flight deploy of main.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Read from .node-version so CI and local development cannot drift apart.
          # nvm, fnm, nodenv and mise all read the same file. It pins a major rather
          # than an exact patch, so security patches arrive without a commit, but it
          # cannot fall below Vite's ^20.19 || >=22.12 floor the way a bare "20" could.
          node-version-file: ".node-version"
          cache: npm

      # ci, not install: honours package-lock.json, so a deploy builds the same tree
      # that was verified locally.
      - name: Install dependencies
        run: npm ci

      # Before the build, so a broken calculation fails the run rather than shipping.
      # 311 checks, ~0.2s.
      - name: Verify statistics
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Pull requests run the verify and build steps above but must not publish.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
